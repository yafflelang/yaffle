name: Release

# Pushing a tag vX.Y.Z publishes every registry package at version X.Y.Z with trusted publishing
# (OIDC): no registry tokens are stored in the repository.
#
# Packages are built in jobs without id-token access; only the publish jobs, which install no
# dependencies, can mint registry credentials. Each publish job runs in the "release" environment,
# which the trusted publisher on every registry is pinned to.
#
# Re-running the workflow after a partial failure is safe: versions already on a registry are
# skipped.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check package versions match the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      npm-tag: ${{ steps.check.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: check
        run: |
          version=$(node .github/scripts/check-release-version.ts "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Prereleases (1.2.3-rc.1) go to npm's "next" dist-tag instead of "latest".
          if [[ "$version" == *-* ]]; then npm_tag=next; else npm_tag=latest; fi
          echo "npm-tag=$npm_tag" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- npm: @yafflelang/runtime, yaffle

  npm-build:
    name: Build npm packages
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build -w @yafflelang/runtime
      - run: npm run build -w yaffle

      - run: |
          mkdir -p release/npm
          npm pack -w @yafflelang/runtime -w yaffle --pack-destination release/npm

      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: release/npm
          if-no-files-found: error

  npm-publish:
    name: Publish to npm
    needs: [version, npm-build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NPM_TAG: ${{ needs.version.outputs.npm-tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: release/npm

      # The runtime goes first: the compiler depends on this exact runtime version.
      - name: Publish
        run: |
          publish() {
            if npm view "$1@$VERSION" version > /dev/null 2>&1; then
              echo "$1@$VERSION is already on npm, skipping"
            else
              npm publish "release/npm/$2-$VERSION.tgz" --access public --tag "$NPM_TAG"
            fi
          }
          publish @yafflelang/runtime yafflelang-runtime
          publish yaffle yaffle

  # ---------------------------------------------------------------- crates.io: yaffle

  # cargo can only publish from source, so this job builds and publishes. The crate has no
  # dependencies, so nothing third-party runs alongside the token.
  crates-publish:
    name: Publish to crates.io
    needs: version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: packages/runtime-rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - id: exists
        run: |
          if curl -sf -A "yaffle-release (github.com/yafflelang/yaffle)" \
              "https://crates.io/api/v1/crates/yaffle/$VERSION" > /dev/null; then
            echo "yaffle $VERSION is already on crates.io, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - if: steps.exists.outputs.skip != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ---------------------------------------------------------------- PyPI: yaffle

  pypi-build:
    name: Build Python distributions
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: python -m pip install build
      - run: python -m build packages/runtime-python --outdir release/python

      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: release/python
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: pypi-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python
          path: release/python

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/python
          skip-existing: true

  # ---------------------------------------------------------------- NuGet: Yaffle.Runtime

  nuget-build:
    name: Build NuGet package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: >-
          dotnet pack packages/runtime-csharp/src/Yaffle.Runtime/Yaffle.Runtime.csproj
          --configuration Release --output release/nuget

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: release/nuget
          if-no-files-found: error

  nuget-publish:
    name: Publish to NuGet
    needs: nuget-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: release/nuget

      # Exchanges the OIDC token for a short-lived API key. "user" is the nuget.org account that
      # owns the trusted publishing policy.
      - uses: NuGet/login@v1
        id: login
        with:
          user: noahcoolboy

      - run: >-
          dotnet nuget push "release/nuget/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
