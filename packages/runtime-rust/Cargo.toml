[package]
name = "yaffle"
version = "0.0.2"
edition = "2021"
description = "yaffle: the runtime for Rust code generated by the yaffle binary-format compiler"
license = "ISC"
authors = ["Noah"]
repository = "https://github.com/yafflelang/yaffle"
homepage = "https://yafflelang.org"
documentation = "https://docs.rs/yaffle"
readme = "README.md"
keywords = ["yaffle", "binary", "parser", "serialization", "file-format"]
categories = ["encoding", "parser-implementations"]
include = ["src/**/*.rs", "Cargo.toml", "README.md"]

[lib]
name = "yaffle"
path = "src/lib.rs"

# No dependencies on purpose: the backend can inline this crate into generated code
# (`inlineRuntime`), which then has no dependencies at all.
[dependencies]
