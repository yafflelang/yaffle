[package]
name = "yaffle-runtime"
version = "0.0.1"
edition = "2021"
description = "Runtime for Rust code generated by the yaffle compiler"
license = "ISC"
authors = ["Noah"]
repository = "https://github.com/noahcoolboy/yaffle"
homepage = "https://yafflelang.org"
documentation = "https://docs.rs/yaffle-runtime"
readme = "README.md"
keywords = ["yaffle", "binary", "parser", "serialization", "file-format"]
categories = ["encoding", "parser-implementations"]
include = ["src/**/*.rs", "Cargo.toml", "README.md"]

[lib]
name = "yaffle_runtime"
path = "src/lib.rs"

# No dependencies on purpose: the backend can inline this crate into generated code
# (`inlineRuntime`), which then has no dependencies at all.
[dependencies]
