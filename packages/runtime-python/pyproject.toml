[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaffle-runtime"
version = "0.0.1"
description = "Runtime for Python code generated by the yaffle compiler"
readme = "README.md"
license = "ISC"
requires-python = ">=3.12"
authors = [{ name = "Noah" }]
keywords = ["yaffle", "binary", "parser", "serialization", "file-format"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://yafflelang.org"
Repository = "https://github.com/noahcoolboy/yaffle"
Documentation = "https://github.com/noahcoolboy/yaffle/blob/main/docs/targets/python.md"

[tool.hatch.build.targets.wheel]
packages = ["yaffle_runtime"]

[tool.hatch.build.targets.sdist]
include = ["yaffle_runtime", "tests", "README.md"]
